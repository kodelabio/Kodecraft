#version: '3.8'

services:
  # Minecraft Server
  minecraft-server:
    image: itzg/minecraft-server:2024.12.1
    container_name: kodecraft-minecraft
    environment:
      EULA: "TRUE"
      MEMORY: "1G"
      VERSION: "1.21.4"
      MODE: "creative"
      DIFFICULTY: "peaceful"
      LEVEL_TYPE: "flat"
      ONLINE_MODE: "FALSE"
      OPS: "ALIEN"
      BRAIN_MODE: "internal"
      GENERATOR_OPTS: "0;1,3x3,2,1"
      SERVER_PORT: "55916"
    ports:
      - "55916:55916"
    volumes:
      - minecraft_data:/data
    healthcheck:
      test: ["CMD", "mc-monitor", "status", "--host", "localhost"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - kodecraft-network


  mindserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kodecraft-mindserver
    ports:
      - "8080:8080"
    environment:
      - MINDSERVER_PORT=8080
    volumes:
      - ./.env:/app/.env:ro
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - kodecraft-network
    entrypoint: node
    command: src/process/mindserver.js
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kodecraft-gateway
    ports:
      - "4001:4001"
      - "5000:5000"
      - "5001:5001"

    environment:
      - DISPLAY=:99  # Keep this only for api-gateway
      - NODE_ENV=production
      - MINECRAFT_HOST=minecraft-server
      - MINECRAFT_PORT=55916
      - MINDSERVER_PORT=8080
      - MINDSERVER_HOST=mindserver
      - N8N_WEBHOOK_URL=http://172.31.14.250:5678/webhook
    volumes:
      - ./src:/app/src 
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    restart: unless-stopped
    networks:
      - kodecraft-network
    depends_on:
      - mindserver
      - minecraft-server
    command: npm start

  # Uncomment the sections below if you want to use MongoDB and n8n in development

  # mongodb:
  #   environment:
  #     - MONGO_INITDB_ROOT_USERNAME=kodecraft
  #     - MONGO_INITDB_ROOT_PASSWORD=changeme
  #   volumes:
  #     - mongodb_data:/data/db
  #     - mongodb_config:/data/configdb
  #   restart: no
  #   # Easier to debug with port exposed
  #   ports:
  #     - "27017:27017"

  # n8n:
  #   environment:
  #     - N8N_BASIC_AUTH_USER=admin
  #     - N8N_BASIC_AUTH_PASSWORD=password
  #   volumes:
  #     - n8n-data:/home/node/.n8n
  #   restart: no
  #   # Access n8n UI
  #   ports:
  #     - "5678:5678"

networks:
  kodecraft-network:
    driver: bridge

volumes:
  minecraft_data:
  #postgres-data:
  #n8n-data: