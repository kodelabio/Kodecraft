services:
  minecraft-server:
    image: itzg/minecraft-server:2024.12.1
    environment:
      EULA: "TRUE"
      MEMORY: "1G"
      VERSION: "1.21.4"
      MODE: "creative"
      DIFFICULTY: "peaceful"
      LEVEL_TYPE: "flat"
      ONLINE_MODE: "FALSE"
      BRAIN_MODE: "internal"
      GENERATOR_OPTS: "0;1,3x3,2,1"
      SERVER_PORT: "55916"
    ports:
      - "55916:55916"
    volumes:
      - minecraft_data:/data
    healthcheck:
      test: ["CMD", "mc-monitor", "status", "--host", "localhost"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  minecraft_data: